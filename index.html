<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>جنگ مورچه‌ها</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1c1b;--panel:#182b29;--line:#2c4744;--ink:#e8efe9;--mut:#9db3ad;--gold:#e5b345;--teal:#2ec4b6}
body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.hide{display:none!important}
#menu,#game{max-width:480px;margin:auto;padding:14px;text-align:center}
h1{font-size:30px;margin:14px 0 4px}#sub{color:var(--mut)}
#levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.lv{font-size:20px;padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-family:inherit}
.lv small{color:var(--gold);font-size:11px}.lv:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button{font-family:inherit;cursor:pointer}
.small{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:14px}
canvas{width:100%;max-width:480px;border-radius:12px;border:1px solid var(--line);background:#233a4d}
#peekt{font-size:18px;font-weight:bold}
#info{font-weight:bold;font-size:17px;margin:10px 0}#info small{color:var(--mut);font-weight:normal}
#nests{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.nest{position:relative;border:1px solid var(--line);background:#26301f;border-radius:10px;padding:4px 0;min-height:70px}
.nest svg{width:100%;max-width:76px}
.nest.on{border-color:var(--gold);background:#3a3a1e;box-shadow:0 0 0 2px var(--gold) inset}
.nest.on::after{content:'✓';position:absolute;top:2px;left:6px;font-size:16px;color:var(--gold)}
#bar{font-size:22px;font-weight:bold;margin:6px;color:var(--gold)}
#atk,#go{font-size:20px;padding:11px 44px;border:0;border-radius:10px;background:var(--gold);color:#1b1405;font-weight:bold}
#over{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:360px;width:100%;text-align:center}
.card button{font-size:17px;margin:6px;padding:9px 22px;border:0;border-radius:9px;background:var(--gold);color:#1b1405;font-weight:bold}
.arr div{font-size:18px;color:var(--teal)}.gold{color:var(--gold)}
.how{text-align:right;list-style-type:persian;padding-inline-start:26px;margin:10px 0;line-height:1.9}.how li::marker{color:var(--gold);font-weight:bold}
.eq{display:inline-block;direction:ltr;unicode-bidi:isolate}
.mut{color:var(--mut);font-size:14px;margin:6px 0 10px}
.card button.alt{background:transparent;color:var(--gold);border:1px solid var(--gold)}
</style></head><body>
<div id="menu"><h1 id="ttl"></h1><p id="sub"></p><div id="levels"></div></div>
<div id="game" class="hide">
 <div class="top"><button class="small" id="back"></button><b id="lvl"></b><span><button class="small" id="eye"></button> <button class="small" id="help">؟</button> <button class="small" id="snd">♪</button></span></div>
 <canvas id="cv" width="360" height="200"></canvas>
 <div id="peekui" class="hide"><p id="peekt"></p><button id="go"></button></div>
 <div id="playui" class="hide"><p id="info"></p><div id="nests"></div><div id="bar"></div><button id="atk"></button></div>
 <div id="over" class="hide"></div>
</div>
<script src="text.js"></script><script src="levels.js"></script><script src="game.js"></script>
</body></html>
