<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>جنگ مورچه‌ها</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,sans-serif;background:#fff3c4;color:#4a3000;min-height:100vh}
.hide{display:none!important}
#menu,#game{max-width:480px;margin:auto;padding:14px;text-align:center}
h1{font-size:30px;margin:10px 0 4px}
#levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.lv{font-size:22px;padding:12px 0;border:0;border-radius:16px;background:#ffb74d;box-shadow:0 4px #d9822b;font-family:inherit}
.lv:disabled{background:#ddd;box-shadow:0 4px #aaa}
.top{display:flex;justify-content:space-between;align-items:center}
button{font-family:inherit;cursor:pointer}
.small{border:0;background:#fff;border-radius:12px;padding:8px 12px;font-size:16px}
canvas{width:100%;max-width:360px;background:#e8f6ff;border-radius:16px;margin-top:8px}
#nests{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.nest{position:relative;border:3px solid #6fae35;background:#9bd35a;border-radius:18px;padding:4px 0;min-height:70px}.nest svg{width:100%;max-width:76px}.nest.on::after{content:'✔';position:absolute;top:0;left:4px;font-size:18px;color:#2e7d12}
.nest.on{background:#d2f58a;border-color:#2e7d12;transform:scale(1.06)}
#peekt{font-size:18px;font-weight:bold}
#bar{font-size:26px;font-weight:bold;margin:6px}
#atk,#go{font-size:22px;padding:12px 40px;border:0;border-radius:20px;background:#e53935;color:#fff;box-shadow:0 5px #a52422}
#over{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:22px;padding:18px;max-width:360px;width:100%;text-align:center}
.card button{font-size:18px;margin:6px;padding:10px 22px;border:0;border-radius:14px;background:#ffb74d}
.arr div{font-size:16px}
</style></head><body>
<div id="menu"><h1 id="ttl"></h1><p id="sub"></p><div id="levels"></div></div>
<div id="game" class="hide">
 <div class="top"><button class="small" id="back">⬅</button><b id="lvl"></b><span><button class="small" id="eye">👀</button> <button class="small" id="snd">🔊</button></span></div>
 <div id="info"></div>
 <canvas id="cv" width="360" height="200"></canvas>
 <div id="peekui" class="hide"><p id="peekt"></p><button id="go"></button></div>
 <div id="playui"><p id="hint"></p><div id="nests"></div>
 <div id="bar"></div><button id="atk"></button></div>
 <div id="over" class="hide"></div>
</div>
<script src="text.js"></script><script src="levels.js"></script><script src="game.js"></script>
</body></html>
